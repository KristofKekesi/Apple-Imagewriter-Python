[tool.poetry]
name = "apple-imagewriter"
version = "0.0.1"
description = "A Python package to control an Apple Imagewriter printer."
authors = ["Kékesi Kristóf <kristof@kekesi.dev>"]
license = "GPL 2.0"
readme = "README.md"
repository = "https://github.com/KristofKekesi/Apple-Imagewriter-Python"
homepage = "https://github.com/KristofKekesi/Apple-Imagewriter-Python"
keywords = ["Apple", "Imagewriter"]

[tool.poetry.dependencies]
pyserial = "^3.5"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"
